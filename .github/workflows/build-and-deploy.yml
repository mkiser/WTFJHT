name: Build and Deploy WTF Just Happened Today? Jekyll Site

run-name: ${{ github.event_name == 'repository_dispatch' && format('publish-due-post {0} {1}', github.event.client_payload.post_path, github.event.client_payload.request_id) || '' }}

on:
  push:
    branches:
      - master
  repository_dispatch:
    types: [publish_due_post]
  schedule:
    - cron: '45 7 * * *'
  workflow_dispatch:  
    inputs:
      incremental:
        description: 'Accepted and ignored. Every deploy builds the complete site.'
        type: boolean
        default: false
      tag_pages:
        description: 'Accepted and ignored. Every deploy builds the tag pages.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    env:
      JEKYLL_ENV: production
      TZ: America/Los_Angeles

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Set up Ruby with caching
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: 3.3.5
          bundler-cache: true

      - name: Write build identity
        run: |
          printf 'build_sha: "%s"\n' "$(git rev-parse HEAD)" > _config_build.yml
          printf 'time: "%s"\n' "$(date '+%Y-%m-%d %H:%M:%S %z')" >> _config_build.yml

      - name: Build Jekyll site
        run: bundle exec jekyll build --config _config.yml,_config_build.yml
        env:
          BUILD_TAG_PAGES: 'true'

      - name: Check build completeness
        run: |
          STATUS=0
          timeout 120 bundle exec ruby .github/scripts/check_build.rb . _site --require-digest || STATUS=$?
          if [ $STATUS -eq 124 ]; then
            echo "ERROR: check_build did not finish within 120 seconds"
          fi
          exit $STATUS

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          BUCKET=s3://whatthefuckjusthappenedtoday.com

          aws s3 cp _site/ $BUCKET/ --recursive --only-show-errors \
            --acl public-read \
            --exclude "*.html" --exclude "*.json" --exclude "*.xml" \
            --exclude "public/js/dear-2040/*" \
            --cache-control "public, max-age=86400" &
          PID4=$!

          aws s3 cp _site/public/js/dear-2040/ $BUCKET/public/js/dear-2040/ --recursive --only-show-errors \
            --acl public-read \
            --exclude "*" \
            --include "*.js" \
            --content-type "text/javascript; charset=utf-8" \
            --cache-control "public, max-age=300, s-maxage=300" &
          PID5=$!

          FAILED=0
          wait $PID4 || { echo "ERROR: Static asset upload pass failed"; FAILED=1; }
          wait $PID5 || { echo "ERROR: Dear 2040 script upload pass failed"; FAILED=1; }
          if [ $FAILED -ne 0 ]; then
            exit 1
          fi
          echo "assets uploaded"

          aws s3 cp _site/ $BUCKET/ --recursive --only-show-errors \
            --acl public-read \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=300, s-maxage=3600" &
          PID1=$!

          aws s3 cp _site/search-index.json $BUCKET/search-index.json --only-show-errors \
            --acl public-read \
            --cache-control "public, max-age=300, s-maxage=3600" &
          PID2=$!

          aws s3 cp _site/ $BUCKET/ --recursive --only-show-errors \
            --acl public-read \
            --exclude "*" \
            --include "*.json" --include "*.xml" \
            --exclude "search-index.json" \
            --cache-control "public, max-age=3600" &
          PID3=$!

          FAILED=0
          for PID in $PID1 $PID2 $PID3; do
            wait $PID || FAILED=1
          done
          if [ $FAILED -ne 0 ]; then
            echo "ERROR: One or more S3 upload passes failed"
            exit 1
          fi
          echo "pages uploaded"

      - name: Purge Cloudflare cache
        run: |
          RESP=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/2fa02b93146397fbf2001d812ab8b31f/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$RESP" | grep -q '"success":true' || { echo "ERROR: Cloudflare cache purge failed: $RESP"; exit 1; }

      - name: Ping search engines and feeds
        run: |
          # Run all pings in parallel
          BASE=https://whatthefuckjusthappenedtoday.com
          HUB=https://pubsubhubbub.appspot.com/
          AUTH_DATE=$(date +%s)
          AUTH_HASH=$(echo -n "${{ secrets.PODCAST_INDEX_API_KEY }}${{ secrets.PODCAST_INDEX_API_SECRET }}${AUTH_DATE}" | sha1sum | awk '{print $1}')

          # WebSub hub
          curl -s -X POST "$HUB" -d "hub.mode=publish" \
            -d "hub.url=$BASE/rss.xml" \
            -d "hub.url=$BASE/atom.xml" \
            -d "hub.url=$BASE/feed.json" \
            -d "hub.url=$BASE/podcasts/index.xml" &

          # Podcast Index
          curl -s -X POST "https://api.podcastindex.org/api/1.0/hub/pubnotify" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "X-Auth-Key: ${{ secrets.PODCAST_INDEX_API_KEY }}" \
            -H "X-Auth-Date: ${AUTH_DATE}" \
            -H "Authorization: ${AUTH_HASH}" \
            -d "url=$BASE/podcasts/index.xml" &

          # Wait for all background jobs
          wait
            
      - name: Post-deploy smoke test
        run: |
          echo "Waiting for Cloudflare cache purge to propagate..."
          sleep 5
          echo "Running smoke tests..."
          curl -sf https://whatthefuckjusthappenedtoday.com/ > /dev/null || { echo "FAIL: Homepage unreachable"; exit 1; }
          curl -sf https://whatthefuckjusthappenedtoday.com/rss.xml > /dev/null || { echo "FAIL: RSS feed unreachable"; exit 1; }
          curl -sf https://whatthefuckjusthappenedtoday.com/search-index.json > /dev/null || { echo "FAIL: Search index unreachable"; exit 1; }
          curl -sf https://whatthefuckjusthappenedtoday.com/corrections/ > /dev/null || { echo "FAIL: Corrections page unreachable"; exit 1; }
          curl -sf https://whatthefuckjusthappenedtoday.com/archive/ > /dev/null || { echo "FAIL: Archive page unreachable"; exit 1; }
          curl -sf https://whatthefuckjusthappenedtoday.com/podcasts/index.xml > /dev/null || { echo "FAIL: Podcast feed unreachable"; exit 1; }
          echo "All smoke tests passed."

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then COLOR="#36a64f"; else COLOR="#ff0000"; fi
          jq -n \
            --arg color "$COLOR" \
            --arg text "$WORKFLOW_NAME #$RUN_NUMBER by $ACTOR - $JOB_STATUS" \
            '{
              "username": "WTFJHT Bot",
              "icon_emoji": ":newspaper:",
              "attachments": [{
                "color": $color,
                "title": "GitHub Actions Build",
                "text": $text
              }]
            }' | curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d @-
