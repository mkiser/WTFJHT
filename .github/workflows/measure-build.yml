          cat > "$scripts/measure_lib.rb" <<'RB'
          require "date"
          require "time"
          require "yaml"

          module Measure
            POST_NAME = /\A(\d{4})-(\d{2})-(\d{2})-(.+)\.(markdown|md|html)\z/
            FRONT_MATTER = /\A---\s*\n(.*?\n?)^(?:---|\.\.\.)\s*$/m
            TAG_SLUG = /\A[a-z0-9]+(?:-[a-z0-9]+)*\z/
            MONTHS = %w[january february march april may june july august september october november december].freeze

            module_function

            def front_matter(path)
              match = File.read(path, encoding: "UTF-8").match(FRONT_MATTER)
              return {} unless match

              YAML.safe_load(match[1], permitted_classes: [Date, Time], aliases: true) || {}
            end

            def local_time(value, fallback)
              case value
              when Time then value.localtime
              when Date then Time.local(value.year, value.month, value.day)
              when String then Time.parse(value).localtime
              else fallback
              end
            end

            def load_posts(repo, declared)
              Dir.glob(File.join(repo, "_posts", "**", "*")).sort.filter_map do |path|
                parts = POST_NAME.match(File.basename(path))
                next unless parts && File.file?(path)

                data = front_matter(path)
                date = local_time(data["date"], Time.local(parts[1].to_i, parts[2].to_i, parts[3].to_i))
                slug = (data["slug"] || parts[4]).to_s
                url = data["permalink"] ? data["permalink"].to_s : date.strftime("/%Y/%m/%d/") + slug + "/"
                unpublished = data["published"] == false
                future = date.to_i > declared.to_i
                {
                  "path" => path,
                  "date" => date,
                  "published" => !unpublished && !future,
                  "future" => future,
                  "unpublished" => unpublished,
                  "tags" => data["tags"].is_a?(Array) ? data["tags"].map(&:to_s).uniq : [],
                  "title" => data["title"].to_s,
                  "post_type" => data["post_type"].to_s,
                  "image" => data["image"].to_s,
                  "current_mood" => data["currentMood"].to_s,
                  "url" => url,
                }
              end
            end
          end
          RB

