      - name: Declare the clock and plan the fixture post
        env:
          DECLARED_INPUT: ${{ inputs.declared_time }}
        run: |
          if [ -n "$DECLARED_INPUT" ]; then
            if ! epoch=$(date -d "$DECLARED_INPUT" +%s 2>/dev/null); then
              echo "declared_time rejected: GNU date cannot parse the input." >&2
              exit 1
            fi
            declared_source="dispatch input"
          else
            now=$(date +%s)
            epoch=$(( now / 60 * 60 ))
            declared_source="time the clock declaration step ran, after checkout and Ruby setup, rounded down to the minute"
          fi
          declared=$(date -d "@$epoch" '+%Y-%m-%d %H:%M:%S %z')
          printf 'incremental: false\ntime: "%s"\n' "$declared" > "$MEASURE_DIR/_config_measure.yml"
          cat "$MEASURE_DIR/_config_measure.yml"
          ruby "$MEASURE_DIR/scripts/fixture.rb" plan "$GITHUB_WORKSPACE" "$epoch" "$MEASURE_DIR/report/fixture.json"
          {
            echo "DECLARED_EPOCH=$epoch"
            echo "DECLARED_TIME=$declared"
            echo "DECLARED_SOURCE=$declared_source"
          } >> "$GITHUB_ENV"

      - name: Record the inputs to the measurement
        run: |
          lock_version() {
            grep -m1 -E "^    $1 \(" Gemfile.lock | sed -E 's/^ +[^ ]+ \(([^)]*)\).*/\1/' || true
          }
          export M_REF="$GITHUB_REF"
          export M_HEAD_SHA=$(git rev-parse HEAD)
          export M_GITHUB_SHA="$GITHUB_SHA"
          export M_RUBY=$(ruby -e 'print RUBY_VERSION')
          export M_BUNDLER=$(bundle -v | awk '{print $NF}')
          export M_JEKYLL=$(lock_version jekyll)
          export M_JEKYLL_SASS_CONVERTER=$(lock_version jekyll-sass-converter)
          export M_SASS=$(lock_version sass)
          export M_NOKOGIRI=$(lock_version nokogiri)
          export M_TZ_ENV="$TZ"
          export M_TZ_SHELL=$(date '+%Z %z')
          export M_TZ_RUBY=$(ruby -e 'print Time.now.strftime("%Z %z")')
          export M_CONFIG_TIMEZONE=$(grep -m1 -E '^timezone:' _config.yml | awk '{print $2}')
          export M_RUNNER_IMAGE="${ImageOS:-unknown} ${ImageVersion:-unknown}"
          export M_CONFIG_FILES="_config.yml,_config_build.yml,_config_measure.yml"
          export M_FLAGS="JEKYLL_ENV=production BUILD_TAG_PAGES=true SKIP_SEARCH_INDEX=unset SKIP_LEADERBOARD=unset CHANGED_DATES=empty incremental=false --profile http_proxy=127.0.0.1:9"
          python3 - "$MEASURE_DIR/report/inputs.json" <<'PY'
          import json
          import os
          import sys

          keys = [
              "ref", "head_sha", "github_sha", "runner_image", "ruby", "bundler",
              "jekyll", "jekyll_sass_converter", "sass", "nokogiri",
              "tz_env", "tz_shell", "tz_ruby", "config_timezone",
              "config_files", "flags",
          ]
          data = {key: os.environ.get("M_" + key.upper(), "") for key in keys}
          data["declared_time"] = os.environ["DECLARED_TIME"]
          data["declared_epoch"] = int(os.environ["DECLARED_EPOCH"])
          data["declared_source"] = os.environ["DECLARED_SOURCE"]
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2)
          print(json.dumps(data, indent=2))
          PY

      - name: Record the embed cache state before build A
        run: |
          python3 "$MEASURE_DIR/scripts/cache.py" record .tweet-cache "$MEASURE_DIR/tweet-cache-baseline" "$MEASURE_DIR/report/cache-baseline.json"

      - name: Write build identity
        run: |
          printf 'build_sha: "%s"\n' "$GITHUB_SHA" > _config_build.yml

      - name: Build A, clean and complete
        env:
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          no_proxy: ''
        run: |
          export HTTP_PROXY="$http_proxy" HTTPS_PROXY="$https_proxy" NO_PROXY=
          bash "$MEASURE_DIR/scripts/build.sh" a
          python3 "$MEASURE_DIR/scripts/clock.py" "$MEASURE_DIR/sites/site-a" "$DECLARED_EPOCH" "$DECLARED_TIME" "$MEASURE_DIR/report/clock-a.json"

      - name: Inventory build A
        run: |
          ruby "$MEASURE_DIR/scripts/inventory.rb" "$GITHUB_WORKSPACE" "$MEASURE_DIR/sites/site-a" "$DECLARED_EPOCH" "$MEASURE_DIR/report/inventory-a.json"

      - name: Build B, clean repeat of A
        env:
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          no_proxy: ''
        run: |
          export HTTP_PROXY="$http_proxy" HTTPS_PROXY="$https_proxy" NO_PROXY=
          bash "$MEASURE_DIR/scripts/build.sh" b
          python3 "$MEASURE_DIR/scripts/clock.py" "$MEASURE_DIR/sites/site-b" "$DECLARED_EPOCH" "$DECLARED_TIME" "$MEASURE_DIR/report/clock-b.json"

      - name: Compare A with B
        run: |
          python3 "$MEASURE_DIR/scripts/compare.py" --label ab --left "$MEASURE_DIR/sites/site-a" --right "$MEASURE_DIR/sites/site-b" --out "$MEASURE_DIR/report"

      - name: Build C, A plus one fixture post that is never committed
        env:
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          no_proxy: ''
        run: |
          export HTTP_PROXY="$http_proxy" HTTPS_PROXY="$https_proxy" NO_PROXY=
          fixture_source=$(ruby "$MEASURE_DIR/scripts/fixture.rb" write "$MEASURE_DIR/report/fixture.json")
          cp "$fixture_source" "$MEASURE_DIR/report/fixture-post.markdown"
          bash "$MEASURE_DIR/scripts/build.sh" c
          rm -f "$fixture_source"
          python3 "$MEASURE_DIR/scripts/clock.py" "$MEASURE_DIR/sites/site-c" "$DECLARED_EPOCH" "$DECLARED_TIME" "$MEASURE_DIR/report/clock-c.json"

      - name: Verify the fixture post was built
        id: fixturecheck
        run: |
          python3 "$MEASURE_DIR/scripts/fixture_check.py" "$MEASURE_DIR/sites/site-c" "$MEASURE_DIR/report/fixture.json" "$MEASURE_DIR/report/clock-c.json" "$MEASURE_DIR/report/fixture-check.json"

      - name: Compare A with C and group the changes by cause
        if: ${{ steps.fixturecheck.outputs.built == 'true' }}
        run: |
          output_dir=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["output_dir"])' "$MEASURE_DIR/report/fixture.json")
          python3 "$MEASURE_DIR/scripts/compare.py" --label ac --left "$MEASURE_DIR/sites/site-a" --right "$MEASURE_DIR/sites/site-c" --out "$MEASURE_DIR/report" --new-post-dir "$output_dir" --unstable-from "$MEASURE_DIR/report/ab"

      - name: Write REPORT.md and the step summary
        if: ${{ always() && env.MEASURE_DIR != '' }}
        run: |
          python3 "$MEASURE_DIR/scripts/report.py" "$MEASURE_DIR/report" > /dev/null
          cat "$MEASURE_DIR/report/REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report and the difference lists
        if: ${{ always() && env.MEASURE_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: measure-build-report
          path: ${{ env.MEASURE_DIR }}/report
          retention-days: 7
          if-no-files-found: warn

      - name: Fail the job when the fixture post was not built
        if: ${{ always() && steps.fixturecheck.outputs.built == 'false' }}
        run: |
          echo "The fixture post was not built, so the A against C result is invalid. See REPORT.md." >&2
          exit 1
