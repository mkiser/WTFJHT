          require "json"
          require "set"
          require "yaml"
          require_relative "measure_lib"

          def plan(repo, epoch, out)
            declared = Time.at(Integer(epoch))
            published = Measure.load_posts(repo, declared).select { |post| post["published"] }
            abort("declared_time rejected: no post is dated at or before the declared clock " + declared.to_s + ".") if published.empty?

            newest = published.max_by { |post| post["date"] }
            fixture_time = [declared - 60, newest["date"]].max
            abort("declared_time rejected: the fixture post would be older than the newest post " + File.basename(newest["path"]) + ".") if fixture_time < newest["date"]
            abort("declared_time rejected: the fixture post would be later than the declared clock " + declared.to_s + ".") if fixture_time > declared

            taxonomy = YAML.safe_load(File.read(File.join(repo, "_data", "tag_taxonomy.yml"))) || {}
            allowed = taxonomy.values.select { |value| value.is_a?(Array) }.flatten.map(&:to_s).to_set
            donor = published.sort_by { |post| post["date"] }.reverse.find { |post| post["tags"].count { |tag| allowed.include?(tag) } >= 2 }
            abort("No published post carries two taxonomy tags.") unless donor
            tags = donor["tags"].select { |tag| allowed.include?(tag) }.first(2)

            day_numbers = published.filter_map { |post| post["title"][/\ADay (\d+)\z/, 1]&.to_i }
            title = day_numbers.empty? ? "Measurement Fixture" : "Day " + (day_numbers.max + 1).to_s
            same_second = published.select { |post| post["date"].to_i == fixture_time.to_i }.map { |post| File.basename(post["path"]) }
            slug = "measure-fixture-post"
            name = fixture_time.strftime("%Y-%m-%d-") + slug + ".markdown"
            if same_second.any? { |other| other >= name }
              slug = "zz-measure-fixture-post"
              name = fixture_time.strftime("%Y-%m-%d-") + slug + ".markdown"
            end
            abort("declared_time rejected: the fixture post cannot sort after the posts that share its second.") if same_second.any? { |other| other >= name }
            source = File.join(repo, "_posts", name)
            abort("The fixture path already exists: " + source) if File.exist?(source)

            lines = [
              "---",
              "title: " + title,
              "date: " + fixture_time.strftime("%Y-%m-%d %H:%M:%S %:z"),
              "tags:",
              *tags.map { |tag| "- " + tag.to_json },
              "description: " + "Measurement fixture.".to_json,
              "image: " + newest["image"].to_json,
              "todayInOneSentence: " + "Measurement fixture sentence; this post exists only inside one workflow run.".to_json,
              "currentMood: " + newest["current_mood"].to_json,
              "---",
              "",
              "1/ **Fixture headline one**. Fixture paragraph for the build measurement workflow.",
              "",
              "2/ **Fixture headline two**. Fixture paragraph for the build measurement workflow.",
              "",
              "3/ **Fixture headline three**. Fixture paragraph for the build measurement workflow.",
            ]

            info = {
              "source_path" => source,
              "output_dir" => fixture_time.strftime("%Y/%m/%d/") + slug + "/",
              "url" => fixture_time.strftime("/%Y/%m/%d/") + slug + "/",
              "date" => fixture_time.strftime("%Y-%m-%d %H:%M:%S %z"),
              "epoch" => fixture_time.to_i,
              "shares_second_with" => same_second,
              "title" => title,
              "tags" => tags,
              "tag_donor" => File.basename(donor["path"]),
              "previous_newest" => File.basename(newest["path"]),
              "previous_newest_date" => newest["date"].strftime("%Y-%m-%d %H:%M:%S %z"),
              "content" => lines.join("\n") + "\n",
            }
            File.write(out, JSON.pretty_generate(info))
            puts JSON.pretty_generate(info.reject { |key, _value| key == "content" })
          end

          def write(plan_path)
            info = JSON.parse(File.read(plan_path))
            abort("The fixture path already exists: " + info["source_path"]) if File.exist?(info["source_path"])
            File.write(info["source_path"], info["content"])
            puts info["source_path"]
          end

