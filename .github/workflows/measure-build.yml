            "post_sources_published" => published.size,
            "post_sources_future" => posts.count { |post| post["future"] },
            "post_sources_unpublished" => posts.count { |post| post["unpublished"] },
            "post_pages_by_path_shape" => files.count { |rel| rel.match?(%r{\A\d{4}/\d{2}/\d{2}/[^/]+/index\.html\z}) },
