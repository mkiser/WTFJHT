          require "json"
          require_relative "measure_lib"

          repo, site, epoch, out = ARGV
          declared = Time.at(Integer(epoch))
          posts = Measure.load_posts(repo, declared)
          published = posts.select { |post| post["published"] }

          files = Dir.glob("**/*", File::FNM_DOTMATCH, base: site).select { |rel| File.file?(File.join(site, rel)) }
          sizes = files.to_h { |rel| [rel, File.size(File.join(site, rel))] }

          def missing(expected, sizes)
            expected.uniq.reject { |rel| sizes.key?(rel) }.sort
          end

          expected_posts = published.map { |post| post["url"].sub(%r{\A/}, "") + "index.html" }
          tags_in_use = published.flat_map { |post| post["tags"] }.select { |tag| Measure::TAG_SLUG.match?(tag) && tag != "index" }.uniq.sort
          expected_tags = tags_in_use.map { |tag| File.join("tags", tag, "index.html") }
          otd_days = published.reject { |post| post["post_type"] == "week-in-review" }.map { |post| [post["date"].month, post["date"].day] }.uniq
          expected_otd = otd_days.map { |month, day| File.join("on-this-day", Measure::MONTHS[month - 1] + "-" + day.to_s, "index.html") }
          expected_years = published.map { |post| File.join("archive", post["date"].strftime("%Y"), "index.html") }.uniq
          expected_months = published.map { |post| File.join("archive", post["date"].strftime("%Y/%m"), "index.html") }.uniq
          named = %w[search-index.json search-version.json sources-leaderboard.json rss.xml atom.xml feed.json podcasts/index.xml sitemap.xml]

          report = {
