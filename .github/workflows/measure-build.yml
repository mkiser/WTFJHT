            "archive_year_pages" => files.count { |rel| rel.match?(%r{\Aarchive/\d{4}/index\.html\z}) },
            "archive_years_missing" => missing(expected_years, sizes),
            "archive_months_expected" => expected_months.size,
            "archive_month_pages" => files.count { |rel| rel.match?(%r{\Aarchive/\d{4}/\d{2}/index\.html\z}) },
            "archive_months_missing" => missing(expected_months, sizes),
            "named_files" => named.to_h { |rel| [rel, sizes[rel]] },
            "total_files" => files.size,
            "total_bytes" => sizes.values.sum,
          }
          File.write(out, JSON.pretty_generate(report))
          puts JSON.pretty_generate(report.transform_values { |value| value.is_a?(Array) ? value.size : value })
