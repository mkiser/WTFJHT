shelves:
- slug: climate
  title: Climate and planetary futures
  short: 'Climate'
  intro: 'Climate books often split into two unhelpful camps: doom or denial. This is for the middle perspective: clear-eyed books about risk, power, policy, imagination, adaptation, and the work of building a livable future.'
- slug: democracy
  title: Democracy, authoritarianism, and civic survival
  short: 'Democracy & Authoritarianism'
  intro: 'These books explain democratic erosion at different scales: institutions, parties, courts, authoritarian networks, political violence, shared reality, civic responsibility, and the norms that make self-government possible.'
- slug: capacity
  title: Abundance, housing, and public capacity
  short: 'Infrastructure'
  intro: 'This is about the machinery of daily life: housing, permitting, delivery, infrastructure, government technology, public goods, and why good intentions often fail at the point of implementation.'
- slug: economy
  title: Political economy, inequality, and the common good
  short: 'Economy'
  intro: 'These books connect markets to power: who benefits, who pays, who gets mobility, who gets security, and why inequality is not just an economic condition but a civic problem.'
- slug: repair
  title: Persuasion, shared reality, and civic repair
  short: ''
  intro: 'This is for the human layer of politics: how people change their minds, why conflict escalates, how identity hardens, and what it takes to keep a civic culture from becoming permanently ungovernable.'
