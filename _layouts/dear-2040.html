---
layout: default
---

<article class="page d2040-page">
{%- if page.d40_view %}
<div id="dear-2040" class="d2040" data-view="{{ page.d40_view }}" data-api-url="https://whatthefuckjusthappenedtoday.com">
<h1 id="d40-h1" class="page-title d40-h1" tabindex="-1">{% if page.d40_view == "note" %}{{ page.d40_h1 | escape }}{% else %}<a href="{{ '/dear-2040/' | relative_url }}">{{ page.d40_h1 | escape }}</a>{% endif %}</h1>
{{ content }}
<div id="d40-announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
{%- if page.d40_noscript %}
<noscript><div class="d2040"><p class="d40-sec d40-pubnote">{{ page.d40_noscript | escape }}</p></div></noscript>
{%- endif %}
{%- else %}
{{ content }}
{%- endif %}
</article>

<script src="{{ site.url }}{{ site.baseurl }}/public/js/dear-2040.js?v={{ site.time | date: '%s' }}"></script>
